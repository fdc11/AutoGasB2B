<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva Unidad</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/registro.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">CONTROL DE CONVERSIONES</a>
        <a href="registro.html" class="nav-item active">Nueva Unidad</a>
        <a href="facturacion.html" class="nav-item">Facturas / Pendientes</a>
        <a href="ajustes.html" class="nav-item">Ajustes</a>
      </nav>
      <div class="sidebar-footer"><button id="btnLogout" class="btn-logout">Cerrar Sesión</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><h1>Nueva Unidad</h1><p>Registro integral de conversiones</p></div>
        <div class="topbar-right"><a href="dashboard.html" class="btn-secondary">Volver al Dashboard</a></div>
      </header>
      <div class="page-body">
        <div class="form-card">
          <div class="form-card-header">
            <div>
              <div class="form-card-title">Formulario maestro</div>
              <div class="form-card-subtitle">Completa la ficha siguiendo el formato de control de conversiones</div>
            </div>
          </div>
          <div class="form-card-body">
            <form id="registroForm" class="form-grid">
              <input id="vin" class="form-input" maxlength="17" placeholder="VIN (17)" required />
              <input id="item" class="form-input" placeholder="ITEM" />
              <input id="folio" class="form-input" placeholder="FOLIO" />
              <input id="anio" class="form-input" type="number" placeholder="AÑO" />
              <input id="mes" class="form-input" type="number" placeholder="MES" />
              <input id="bloque" class="form-input" placeholder="BLOQUE" />
              <select id="sede" class="form-select"></select>
              <select id="tipoConversion" class="form-select"></select>
              <select id="concesionaria" class="form-select"></select>
              <input id="concesionariaOtro" class="form-input hidden" placeholder="Especificar concesionaria" />
              <input id="estado" class="form-input" placeholder="ESTADO" />
              <input id="propietario" class="form-input" placeholder="PROPIETARIO" />
              <input id="dniRuc" class="form-input" placeholder="DNI/RUC" />
              <input id="telefono" class="form-input" placeholder="TELEFONO" />
              <input id="placa" class="form-input" placeholder="PLACA" />
              <input id="marca" class="form-input" placeholder="MARCA" />
              <input id="modelo" class="form-input" placeholder="MODELO" />
              <input id="anioVehiculo" class="form-input" type="number" placeholder="AÑO VEHICULO" />
              <input id="color" class="form-input" placeholder="COLOR" />
              <input id="combustible" class="form-input" placeholder="COMBUSTIBLE" />
              <input id="vinSerie" class="form-input" placeholder="VIN/SERIE" />
              <input id="motor" class="form-input" placeholder="MOTOR" />
              <select id="tipoTanqueGlp" class="form-select"></select>
              <select id="marcaTanque" class="form-select"></select>
              <input id="capacidadTanque" class="form-input" placeholder="CAPACIDAD TANQUE" />
              <input id="numeroKit" class="form-input" placeholder="NUMERO KIT" />
              <input id="ecu" class="form-input" placeholder="ECU" />
              <input id="rampa" class="form-input" placeholder="RAMPA" />
              <input id="reductor" class="form-input" placeholder="REDUCTOR" />
              <input id="multivalvula" class="form-input" placeholder="MULTIVALVULA" />
              <input id="cilindro" class="form-input" placeholder="CILINDRO" />
              <input id="fechaConversion" class="form-input" type="date" />
              <input id="certificadora" class="form-input" placeholder="CERTIFICADORA" />
              <input id="tecnico" class="form-input" placeholder="TECNICO" />
              <textarea id="observaciones" class="form-input form-textarea" placeholder="OBSERVACIONES"></textarea>
              <input id="costo" class="form-input" type="number" placeholder="COSTO" />
              <select id="bono" class="form-select"></select>
              <input id="facturaNumero" class="form-input" placeholder="FACTURA N°" />
              <input id="fechaFactura" class="form-input" type="date" />
              <input id="pago" class="form-input" placeholder="PAGO" />
              <input id="estadoPago" class="form-input" placeholder="ESTADO PAGO" />
              <input id="entrega" class="form-input" placeholder="ENTREGA" />
              <input id="fechaEntrega" class="form-input" type="date" />
              <div class="full-col" style="display:flex;gap:8px;">
                <button type="submit" class="btn-primary" id="btnSubmit">Registrar Unidad</button>
                <a href="dashboard.html" class="btn-secondary">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="../js/registro.js"></script>
</body>
</html>
