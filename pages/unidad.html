<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha de Unidad</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/unidad.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">CONTROL DE CONVERSIONES</a>
        <a href="registro.html" class="nav-item">Nueva Unidad</a>
        <a href="facturacion.html" class="nav-item">Facturas / Pendientes</a>
        <a href="ajustes.html" class="nav-item">Ajustes</a>
      </nav>
      <div class="sidebar-footer"><button id="btnLogout" class="btn-logout">Cerrar Sesión</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><h1>Ficha de Unidad</h1><p id="topVin">—</p></div>
        <div class="topbar-right"><a href="dashboard.html" class="btn-secondary">Volver</a></div>
      </header>
      <div class="page-body">
        <div class="detail-card">
          <div class="detail-card-header"><span class="detail-card-title">Snapshot operativo completo</span></div>
          <div class="detail-card-body">
            <pre id="snapshotView" style="white-space:pre-wrap;margin:0;"></pre>
          </div>
        </div>
        <div class="detail-card">
          <div class="detail-card-header"><span class="detail-card-title">Timeline / Historial de servicios</span></div>
          <div class="detail-card-body">
            <div id="timeline"></div>
            <div style="display:grid;gap:8px;margin-top:12px;">
              <input id="evtTipo" class="form-input" placeholder="Tipo de evento" />
              <input id="evtTecnico" class="form-input" placeholder="Técnico" />
              <textarea id="evtObs" class="form-input form-textarea" placeholder="Observaciones"></textarea>
              <button id="btnAgregarEvento" class="btn-primary">Agregar evento</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="../js/unidad.js"></script>
</body>
</html>
