<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facturas Pendientes</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/facturacion.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">CONTROL DE CONVERSIONES</a>
        <a href="registro.html" class="nav-item">Nueva Unidad</a>
        <a href="facturacion.html" class="nav-item active">Facturas / Pendientes</a>
        <a href="ajustes.html" class="nav-item">Ajustes</a>
      </nav>
      <div class="sidebar-footer"><button id="btnLogout" class="btn-logout">Cerrar Sesión</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><h1>FACTURAS PENDIENTES DE PAGO</h1></div>
        <div class="topbar-right"><button id="btnNuevaFactura" class="btn-primary">Nueva Factura</button></div>
      </header>
      <div class="page-body">
        <div class="fac-table-card">
          <div class="fac-table-scroll">
            <table class="fac-table">
              <thead>
                <tr>
                  <th>Numero Factura</th><th>Receptor</th><th>Importe</th><th>Emision</th><th>Estado</th><th>Unidades</th><th>Accion</th>
                </tr>
              </thead>
              <tbody id="facTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="modal-overlay hidden" id="modalFactura">
    <div class="modal-box">
      <div style="display:grid;gap:8px;">
        <input id="facNumero" class="form-input" placeholder="Numero factura" />
        <input id="facReceptor" class="form-input" placeholder="Receptor" />
        <input id="facImporte" type="number" class="form-input" placeholder="Importe total" />
        <input id="facFechaEmision" type="date" class="form-input" />
        <select id="facEstado" class="form-select"><option value="PENDIENTE">PENDIENTE</option><option value="PAGADO">PAGADO</option></select>
        <input id="facUnidades" class="form-input" placeholder="VINs separados por coma" />
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modalFacturaClose">Cancelar</button>
        <button class="btn-primary" id="btnGuardarFactura">Guardar</button>
      </div>
    </div>
  </div>
  <script type="module" src="../js/facturacion.js"></script>
</body>
</html>
